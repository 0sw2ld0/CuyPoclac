name: Compilar instaladores

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ".[dev,encryption]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller packaging/cuypoclac.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: CuyPoclac-${{ matrix.os }}
          path: dist/
